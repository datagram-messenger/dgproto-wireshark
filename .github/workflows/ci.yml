name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Syntax, lint, self-test, and protocol fixtures
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y lua5.3 lua-check tshark

      - name: Validate (syntax, lint, self-test, fixtures)
        run: make check LUA=lua5.3 LUAC=luac5.3

      - name: Verify deterministic package assembly
        run: |
          make package LUA=lua5.3 LUAC=luac5.3 VERSION=0.0.0
          python -m zipfile --list dist/dgproto-wireshark-0.0.0.zip
          (cd dist && sha256sum --check dgproto-wireshark-0.0.0.zip.sha256)
